name: Release signed Helm chart

on:
  workflow_call:
    inputs:
      chart_name:
        description: Chart name and final OCI repository name
        type: string
        required: true
      chart_path:
        description: Path to the chart directory
        type: string
        required: true
      helm_registry:
        description: OCI registry hostname
        type: string
        required: true
      registry_namespace:
        description: OCI repository namespace
        type: string
        required: true
      notation_key_name:
        description: Local name assigned to the Notation signing key
        type: string
        default: jon-soh-re
      generate_readme:
        description: Regenerate and commit the chart README after a successful release
        type: boolean
        default: true
      helm_docs_version:
        description: helm-docs version used to regenerate the README
        type: string
        default: 1.14.2
    secrets:
      release_token:
        required: true
      helm_username:
        required: true
      helm_password:
        required: true
      notation_private_key:
        required: true
      notation_certificate_chain:
        required: true
      notation_ca_certificate:
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}
    steps:
      - name: Create release
        id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ secrets.release_token }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      CHART_NAME: ${{ inputs.chart_name }}
      CHART_PATH: ${{ inputs.chart_path }}
      CHART_VERSION: ${{ needs.release-please.outputs.version }}
      REGISTRY: ${{ inputs.helm_registry }}
      REGISTRY_NAMESPACE: ${{ inputs.registry_namespace }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.release_token }}

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Add release annotations
        env:
          CREATED: ${{ github.event.head_commit.timestamp }}
          REVISION: ${{ github.sha }}
        run: |
          cat >> "${CHART_PATH}/Chart.yaml" <<EOF
            org.opencontainers.image.created: "${CREATED}"
            org.opencontainers.image.revision: "${REVISION}"
            org.opencontainers.image.version: "${CHART_VERSION}"
          EOF
          helm lint "${CHART_PATH}"

      - name: Log in to Zot
        env:
          HELM_USER: ${{ secrets.helm_username }}
          HELM_PASS: ${{ secrets.helm_password }}
        run: |
          test -n "${HELM_USER}"
          test -n "${HELM_PASS}"
          printf '%s' "${HELM_PASS}" | helm registry login "${REGISTRY}" --username "${HELM_USER}" --password-stdin

      - name: Package and push chart
        id: push
        run: |
          helm package "${CHART_PATH}" --version "${CHART_VERSION}"
          push_output="$(helm push "${CHART_NAME}-${CHART_VERSION}.tgz" "oci://${REGISTRY}/${REGISTRY_NAMESPACE}")"
          printf '%s\n' "${push_output}"
          digest="$(printf '%s\n' "${push_output}" | awk '/^Digest: / { print $2 }')"
          test -n "${digest}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Sign and verify chart digest
        uses: Jmainguy/notation-action@v1
        with:
          version: 1.3.2
          artifact: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ env.CHART_NAME }}@${{ steps.push.outputs.digest }}
          key-name: ${{ inputs.notation_key_name }}
          private-key: ${{ secrets.notation_private_key }}
          certificate-chain: ${{ secrets.notation_certificate_chain }}
          ca-certificate: ${{ secrets.notation_ca_certificate }}
          username: ${{ secrets.helm_username }}
          password: ${{ secrets.helm_password }}

      - name: Verify published chart
        run: |
          helm show chart "oci://${REGISTRY}/${REGISTRY_NAMESPACE}/${CHART_NAME}" --version "${CHART_VERSION}"

      - name: Install helm-docs
        if: inputs.generate_readme
        env:
          HELM_DOCS_VERSION: ${{ inputs.helm_docs_version }}
        run: |
          archive="helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz"
          release_url="https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}"
          curl --fail --silent --show-error --location "${release_url}/${archive}" --output "${RUNNER_TEMP}/${archive}"
          curl --fail --silent --show-error --location "${release_url}/checksums.txt" --output "${RUNNER_TEMP}/helm-docs-checksums.txt"
          expected="$(awk -v archive="${archive}" '$2 == archive { print $1 }' "${RUNNER_TEMP}/helm-docs-checksums.txt")"
          test -n "${expected}"
          printf '%s  %s\n' "${expected}" "${RUNNER_TEMP}/${archive}" | sha256sum --check -
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}" helm-docs
          printf '%s\n' "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Regenerate released chart README
        if: inputs.generate_readme
        run: |
          helm-docs --chart-search-root "${CHART_PATH}"
          if git diff --quiet -- "${CHART_PATH}/README.md"; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${CHART_PATH}/README.md"
          git commit -m "docs: regenerate Helm chart README [skip ci]"
          git push origin HEAD:main
