name: Release signed Helm chart

on:
  workflow_call:
    inputs:
      chart_name:
        description: Chart name and final OCI repository name
        type: string
        required: true
      chart_path:
        description: Path to the chart directory
        type: string
        required: true
      helm_registry:
        description: OCI registry hostname
        type: string
        required: true
      registry_namespace:
        description: OCI repository namespace
        type: string
        required: true
      notation_key_name:
        description: Local name assigned to the Notation signing key
        type: string
        default: jon-soh-re
    secrets:
      release_token:
        required: true
      helm_username:
        required: true
      helm_password:
        required: true
      notation_private_key:
        required: true
      notation_certificate_chain:
        required: true
      notation_ca_certificate:
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}
    steps:
      - name: Create release
        id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ secrets.release_token }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      CHART_NAME: ${{ inputs.chart_name }}
      CHART_PATH: ${{ inputs.chart_path }}
      CHART_VERSION: ${{ needs.release-please.outputs.version }}
      REGISTRY: ${{ inputs.helm_registry }}
      REGISTRY_NAMESPACE: ${{ inputs.registry_namespace }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Set up Notation
        uses: Jmainguy/notation-action@v1
        with:
          version: 1.3.2

      - name: Add release annotations
        env:
          CREATED: ${{ github.event.head_commit.timestamp }}
          REVISION: ${{ github.sha }}
        run: |
          cat >> "${CHART_PATH}/Chart.yaml" <<EOF
            org.opencontainers.image.created: "${CREATED}"
            org.opencontainers.image.revision: "${REVISION}"
            org.opencontainers.image.version: "${CHART_VERSION}"
          EOF
          helm lint "${CHART_PATH}"

      - name: Log in to Zot
        env:
          HELM_USER: ${{ secrets.helm_username }}
          HELM_PASS: ${{ secrets.helm_password }}
        run: |
          test -n "${HELM_USER}"
          test -n "${HELM_PASS}"
          printf '%s' "${HELM_PASS}" | helm registry login "${REGISTRY}" --username "${HELM_USER}" --password-stdin

      - name: Package and push chart
        id: push
        run: |
          helm package "${CHART_PATH}" --version "${CHART_VERSION}"
          push_output="$(helm push "${CHART_NAME}-${CHART_VERSION}.tgz" "oci://${REGISTRY}/${REGISTRY_NAMESPACE}")"
          printf '%s\n' "${push_output}"
          digest="$(printf '%s\n' "${push_output}" | awk '/^Digest: / { print $2 }')"
          test -n "${digest}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Sign and verify chart digest
        env:
          NOTATION_PRIVATE_KEY: ${{ secrets.notation_private_key }}
          NOTATION_CERTIFICATE_CHAIN: ${{ secrets.notation_certificate_chain }}
          NOTATION_CA_CERTIFICATE: ${{ secrets.notation_ca_certificate }}
          NOTATION_USERNAME: ${{ secrets.helm_username }}
          NOTATION_PASSWORD: ${{ secrets.helm_password }}
          NOTATION_KEY_NAME: ${{ inputs.notation_key_name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          notation_config="${RUNNER_TEMP}/notation-config"
          signing_dir="${RUNNER_TEMP}/notation-signing"
          mkdir -p "${notation_config}/notation/truststore/x509/ca/release" "${signing_dir}"
          chmod 700 "${notation_config}" "${signing_dir}"
          key_file="${signing_dir}/signer.key"
          certificate_file="${signing_dir}/certificate-chain.pem"
          printf '%s' "${NOTATION_PRIVATE_KEY}" > "${key_file}"
          printf '%s' "${NOTATION_CERTIFICATE_CHAIN}" > "${certificate_file}"
          printf '%s' "${NOTATION_CA_CERTIFICATE}" > "${notation_config}/notation/truststore/x509/ca/release/ca.crt"
          chmod 600 "${key_file}" "${certificate_file}"
          jq -n \
            --arg name "${NOTATION_KEY_NAME}" \
            --arg key "${key_file}" \
            --arg certificate "${certificate_file}" \
            '{default:$name,keys:[{name:$name,keyPath:$key,certPath:$certificate}]}' \
            > "${notation_config}/notation/signingkeys.json"
          jq -n --arg scope "${REGISTRY}/${REGISTRY_NAMESPACE}/${CHART_NAME}" \
            '{version:"1.0",trustPolicies:[{name:"release",registryScopes:[$scope],signatureVerification:{level:"strict"},trustStores:["ca:release"],trustedIdentities:["*"]}]}' \
            > "${notation_config}/notation/trustpolicy.json"
          artifact="${REGISTRY}/${REGISTRY_NAMESPACE}/${CHART_NAME}@${DIGEST}"
          XDG_CONFIG_HOME="${notation_config}" notation sign --key "${NOTATION_KEY_NAME}" --signature-format jws "${artifact}"
          XDG_CONFIG_HOME="${notation_config}" notation verify "${artifact}"

      - name: Verify published chart
        run: |
          helm show chart "oci://${REGISTRY}/${REGISTRY_NAMESPACE}/${CHART_NAME}" --version "${CHART_VERSION}"
